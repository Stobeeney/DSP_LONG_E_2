<body>
  <header class="top">
    <div class="wrap">
      <button class="mark" id="homeBtn" aria-label="Home">
        <span class="sq" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 21V9M10 21V13M16 21V6M22 21V15"/></g><g fill="currentColor"><circle cx="4" cy="8" r="2.5"/><circle cx="10" cy="12" r="2.5"/><circle cx="16" cy="5" r="2.5"/><circle cx="22" cy="14" r="2.5"/></g></svg></span>
      </button>
      <span class="pill flame" title="Daily streak"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.2 2.3c.5 3-1.1 4.8-2.7 6.6C8.9 10.6 7.5 12.3 7.5 15c0 3.6 2.5 6.6 5.2 6.6 3.2 0 5.8-2.7 5.8-6.3 0-2.3-1-4-2.3-5.3.1 1.8-.6 3-1.8 3.6.6-3.8-.6-8.4-1.2-11.3Z"/></svg><span class="vh">Day streak</span><span class="num" id="streakVal"></span></span>

    </div>
  </header>

  <main id="app"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
